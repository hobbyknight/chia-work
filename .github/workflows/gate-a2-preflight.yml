name: Gate A.2 - Gemmini Preflight

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gate-a2-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHIA_COMMIT: 16c35e92aaaf9511c6453bf94cd5cf589698f4e3
      THIS_MACHINE: 127.0.0.1
      CHIA_WORK_DIR: ${{ github.workspace }}
      USER: chia-ci
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10.19
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.19'
          cache: 'pip'

      - name: Checkout pinned CHIA core without recursive submodules
        run: |
          git clone --no-recurse-submodules https://github.com/ucb-bar/chia external/chia
          git -C external/chia fetch origin "$CHIA_COMMIT" --depth=1
          git -C external/chia checkout --detach "$CHIA_COMMIT"
          test "$(git -C external/chia rev-parse HEAD)" = "$CHIA_COMMIT"

      - name: Install CHIA core and harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e external/chia
          python -m pip install -e .

      - name: Validate Gate A.2 contract
        run: |
          python scripts/gate_a2_preflight.py --output results/gate-a2-preflight.json

      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: gate-a2-preflight-evidence
          path: results/gate-a2-preflight.json
