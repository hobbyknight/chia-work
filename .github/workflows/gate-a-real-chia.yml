name: Gate A - Real CHIA Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  real-chia-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHIA_COMMIT: 16c35e92aaaf9511c6453bf94cd5cf589698f4e3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10.19
        uses: actions/setup-python@v5
        with:
          python-version: '3.10.19'
          cache: 'pip'

      - name: Checkout pinned CHIA core without recursive submodules
        run: |
          git clone --no-recurse-submodules https://github.com/ucb-bar/chia external/chia
          git -C external/chia fetch origin "$CHIA_COMMIT" --depth=1
          git -C external/chia checkout --detach "$CHIA_COMMIT"
          git -C external/chia submodule status || true
          test "$(git -C external/chia rev-parse HEAD)" = "$CHIA_COMMIT"

      - name: Install CHIA core and harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e external/chia
          python -m pip install -e .

      - name: Verify CHIA core imports
        run: |
          python - <<'PY'
          from chia.base.ChiaFunction import ChiaFunction, get  # noqa: F401
          import ray
          print('CHIA core imports: PASS')
          print('Ray version:', ray.__version__)
          PY

      - name: Run real CHIA smoke
        run: |
          python scripts/real_chia_smoke.py --output results/ci-real-chia-smoke.jsonl

      - name: Reject mocked output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows = [json.loads(line) for line in Path('results/ci-real-chia-smoke.jsonl').read_text().splitlines() if line.strip()]
          assert rows, 'missing result rows'
          assert all(row['mocked'] is False for row in rows), rows
          assert all(row['verification'] == 'PASS' for row in rows), rows
          print('non-mocked Gate A record: PASS')
          PY

      - name: Upload Gate A evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-a-real-chia-evidence
          path: results/ci-real-chia-smoke.jsonl
          if-no-files-found: warn
