[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chia-work-safeagent"
version = "0.1.0"
description = "SafeAgent experiment harness for the A3 CHIA Hackathon"
requires-python = ">=3.10,<3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<10", "google-adk==2.9.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
